# HaT PheWAS, part 2: the control pool, as a Telescope intake.
# Same tables and columns as the hat_ pull (reference/hat_cosmos_blueprint.yaml),
# with ctrl_Patients as the PK. Why it's drawn this way: docs/plan/decisions.md,
# D30. Before running:
#   - hat_patient_keys.parquet (written by build_group_parquet.py on the hat_ pull)
#     goes beside this file: the PK excludes those patients.
#   - pool_permille thins Cosmos to that many patients per 1,000 before sampling;
#     stop_at_for_pk_table (under smallset) caps the pool at 300,000. If the pool
#     comes back under 300,000, raise pool_permille.
#   - project_db: check it is the one to use.
cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 20150101
  max_date_key: 20260601
test_options:
  smallset: true
  stop_at_for_pk_table: 300000
  random_pk_sample: true
project_vars:
  project_folder: HaT PheWAS Controls
vars:
  control_index_start: 20211001
  pool_permille: 10
upload_cohorts:
- name: HatPatientKeys
  dest_table: HatPatientKeys
  file_type: parquet
  file_loc: hat_patient_keys.parquet
  pending_transfer: true
  push_this_cycle: true
  columns:
  - name: PatientDurableKey
    type: BIGINT
multipliers: []
batching:
- chunk: 2000
cohorts:
- name: ctrl_Patients
  dest_table: ctrl_Patients
  type: pk
  pull_this_cycle: true
  description: 'Control pool: patients with no D89.44, each at one random completed Office Visit or Follow-Up
    from 2021-10-01 (the pseudo-index), with age and every PatientDim column. A hash of the patient key
    keeps about pool_permille per 1,000 patients; stop_at_for_pk_table caps the pool, ordered by a hash
    of the key.

    '
  granularity: One row per patient, at one random clinic visit.
  dedup_keys:
  - - PatientDurableKey
  dedup_order_by:
  - RandomOrder
  columns:
  - source: ef.PatientDurableKey
    name: PatientDurableKey
    nullable: false
  - source: ef.DateKey
    name: IndexDate
    nullable: false
    description: 'DateKey (YYYYMMDD) of the sampled clinic visit: the pseudo-index date.'
  - source: ef.EncounterKey
    name: IndexEncounterKey
    nullable: false
  - source: ef.DerivedEncounterType_X
    name: IndexEncounterType
    nullable: true
  - source: ef.AgeKey
    name: IndexAgeKey
    nullable: true
  - source: dep.DepartmentSpecialty
    name: IndexDepartmentSpecialty
    nullable: true
  - source: ABS(CHECKSUM(ef.EncounterKey))
    name: RandomOrder
    nullable: true
    description: 'A hash of the encounter: picks one visit per patient at random, the same on every run.'
    type: INT
  - source: dur.Years
    name: AgeAtIndex
    nullable: true
    description: Age in years at the sampled clinic visit (AgeKey through DurationDim).
  - source: dur.Days
    name: AgeAtIndexDays
    nullable: true
  - source: dur.DaysDisplayString
    name: AgeAtIndexDaysDisplayString
    nullable: true
  - source: dur.DisplayString
    name: AgeAtIndexDisplayString
    nullable: true
  - source: dur.Months
    name: AgeAtIndexMonths
    nullable: true
  - source: dur.MonthsDisplayString
    name: AgeAtIndexMonthsDisplayString
    nullable: true
  - source: dur.Weeks
    name: AgeAtIndexWeeks
    nullable: true
  - source: dur.WeeksDisplayString
    name: AgeAtIndexWeeksDisplayString
    nullable: true
  - source: dur.YearsDisplayString
    name: AgeAtIndexYearsDisplayString
    nullable: true
  - source: p._IsDeleted
    name: PatientIsDeleted
    nullable: false
  - source: p._IsInferred
    name: PatientIsInferred
    nullable: false
  - source: p.AgeInYears
    name: AgeInYears
    nullable: true
  - source: p.BirthDate
    name: BirthDate
    nullable: true
  - source: p.BirthDateAccuracy_X
    name: BirthDateAccuracy_X
    nullable: true
  - source: p.EarliestPossibleBirthDate_X
    name: EarliestPossibleBirthDate_X
    nullable: true
  - source: p.BloodType_X
    name: BloodType_X
    nullable: true
  - source: p.BloodTypeAndRhesusFactor_X
    name: BloodTypeAndRhesusFactor_X
    nullable: true
  - source: p.Country
    name: Country
    nullable: true
  - source: p.DeathDate
    name: DeathDate
    nullable: true
    description: Ends observation early for patients who died.
  - source: p.Ethnicity
    name: Ethnicity
    nullable: true
  - source: p.FifthRace
    name: FifthRace
    nullable: true
  - source: p.FirstRace
    name: FirstRace
    nullable: true
  - source: p.FourthRace
    name: FourthRace
    nullable: true
  - source: p.GenderIdentity
    name: GenderIdentity
    nullable: true
  - source: p.HasPcp_X
    name: HasPcp_X
    nullable: true
  - source: p.IsCurrent
    name: IsCurrent
    nullable: false
  - source: p.IsValid
    name: IsValid
    nullable: false
  - source: p.LastImmunizationQueryInstantUtc
    name: LastImmunizationQueryInstantUtc
    nullable: true
  - source: p.MaritalStatus
    name: MaritalStatus
    nullable: true
  - source: p.MultiRacial
    name: MultiRacial
    nullable: true
  - source: p.PreferredLanguage
    name: PreferredLanguage
    nullable: true
  - source: p.PreliminaryCauseOfDeathDiagnosisKey
    name: PreliminaryCauseOfDeathDiagnosisKey
    nullable: true
  - source: p.PrimaryRUCA_X
    name: PrimaryRUCA_X
    nullable: true
  - source: p.ReliableSex
    name: ReliableSex
