# HaT PheWAS control-selection recipe.
# Paths are relative to the repo root unless absolute paths are supplied.
# Column references use alias.column, e.g. p.Patient_ID or dx.DiagnosisCode.

study:
  name: synthetic_hat_control_tutorial
  exposure_name: HaT
  notes: >
    Controls are no-known-HaT patients, not proven non-HaT patients. This should
    be stated as possible exposure misclassification in the final study.

parquets:
  p:
    path: tutorial/synthetic_parquets/all_patients.parquet
    description: one row per patient with case/control flag and matching variables
  idx:
    path: tutorial/synthetic_parquets/index_events.parquet
    description: case index diagnosis date or control pseudo-index date
  dx:
    path: tutorial/synthetic_parquets/diagnosis_events.parquet
    description: one row per diagnosis event

required_columns:
  patient_id: p.Patient_ID
  exposure_flag: p.HaT_Flag
  no_known_exposure_flag: p.NoKnownHaTDiagnosis
  sex: p.Sex
  race: p.Race
  ethnicity: p.Ethnicity
  index_date: p.IndexDate
  index_year: p.IndexYear
  index_quarter: p.IndexQuarter
  age_at_index: p.AgeAtIndex
  observation_start_date: p.ObservationStartDate
  observation_end_date: p.ObservationEndDate
  years_before_index: p.YearsBeforeIndex
  years_after_index: p.YearsAfterIndex
  # Clinic visits = distinct dates with an EncounterFact row where
  # IsOutpatientFaceToFaceVisit = 1. This is the utilization measure.
  clinic_visits_pre_index: p.ClinicVisitCountPreIndex
  clinic_visits_post_index: p.ClinicVisitCountPostIndex
  # Not collected: pre-index diagnosis count and problem-list count. In a
  # pre-index PheWAS those diagnoses are the outcomes, so matching or adjusting
  # on them removes part of the HaT signal.

diagnosis_columns:
  patient_id: dx.Patient_ID
  diagnosis_date: dx.DiagnosisDate
  diagnosis_code: dx.DiagnosisCode
  vocabulary: dx.Vocabulary

case_definition:
  exposure_value: 1
  index_date_source: first_reliable_hat_diagnosis_or_cohort_entry
  repeated_diagnosis_count_column: p.RepeatedHaTDiagnosisCount
  minimum_repeated_diagnoses: 2

control_pool:
  exposure_value: 0
  no_known_exposure_value: 1
  candidate_pool_ratio_to_cases: 20
  eligibility_filters:
    minimum_years_before_index: 1.0
    minimum_years_after_index: 0.25
    minimum_clinic_visits_pre_index: 2
    exclude_any_hat_diagnosis_ever: true  # any D89.44, any date, even a single code
  pseudo_index_date:
    strategy: match_case_calendar_distribution
    preferred_granularity: quarter
    fallback_granularity: year

matching:
  tool: MatchIt
  estimand: ATT
  final_controls_per_case: 4
  method: nearest
  distance: glm
  replace: false
  exact:
    - p.Sex
    - p.IndexQuarter
  balance_formula:
    - p.AgeAtIndex
    - p.YearsBeforeIndex
    - p.YearsAfterIndex
    - log1p(p.ClinicVisitCountPreIndex)
    - p.Race
    - p.Ethnicity
  caliper:
    value: 0.2
    standardized: true
  diagnostics:
    max_standardized_mean_difference: 0.1
    review_unmatched_cases: true
    review_match_ratio_achieved: true

outputs:
  match_ready_cohort: tutorial/synthetic_parquets/match_ready_cohort.parquet
  matched_cohort: tutorial/synthetic_parquets/matchit_4to1_matched.parquet
  matched_pairs: tutorial/synthetic_parquets/matchit_4to1_pairs.parquet
  pheauxwas_people_csv: tutorial/work/hat_people_matched.csv
  pheauxwas_events_csv: tutorial/work/hat_diagnosis_events_{window}.csv
  pheauxwas_out_prefix: tutorial/results/hat_phewas_{window}

# Done by prepare_phewas_inputs.py, between matching and the PheWAS.
# pheauxWAS counts every event it is given, so these must be applied first.
phewas_prep:
  # Codes that define the exposure. D89.44 maps to phecode GE_969.4
  # (Hereditary alpha tryptasemia); left in, it is a guaranteed top hit.
  exclude_codes:
    - D89.44
  # Which events count, relative to each patient's index date. Run pre as the
  # primary analysis and post as a sensitivity analysis: hits that appear only
  # post-index may be diagnostic workup rather than HaT biology.
  # The index day itself is in neither pre nor post.
  windows:
    - pre
    - post
  # pre keeps only the 3 years before index, so every patient's window is equal.
  lookback_years: 3

phewas:
  engine: pheauxWAS
  # The matched sets (MatchIt's subclass) are not used in the regression:
  # this is covariate-adjusted logistic regression on the matched cohort, not
  # conditional logistic regression. State this in the methods.
  people:
    file: tutorial/work/hat_people_matched.csv
    id_col: Patient_ID
    predictors:
      - HaT_Flag
    covariates:
      - AgeAtIndex
      - Sex
      - Race
      - Ethnicity
      - YearsBeforeIndex
      - ClinicVisitCountPreIndex
    sex_col: Sex
  events:
    file: tutorial/work/hat_diagnosis_events_{window}.csv
    id_col: Patient_ID
    code_col: DiagnosisCode
    vocab_col: Vocabulary
    date_col: DiagnosisDate
  phecodes:
    map: phecode/phecodeX_ICD_CM_map_flat.csv
    definitions: phecode/phecodeX_info.csv
  settings:
    min_code_count: 2
    min_cases: 20
    firth: auto
