# HaT PheWAS, part 1: the HaT patients and what the PheWAS needs about them.
# Controls come later, as ctrl_ tables, with the same columns.
#
# Three tables:
#   hat_Patients     PK. One row per patient with ANY D89.44, at their first D89.44.
#                    This is also the exclusion list for controls. The 2-distinct-dates
#                    case rule is applied afterwards, in Python, from hat_Diagnoses.
#   hat_Encounters   Every encounter in the window. Gives observation start/end
#                    (first/last encounter) and clinic-visit counts, in Python.
#   hat_Diagnoses    Every ICD-10-CM diagnosis event in the window, one row per
#                    event and code. The PheWAS events. Also gives the D89.44 date
#                    count (case rule) and other D89.4x codes before index.
#
# Cosmos tables read: PatientDim, DiagnosisEventFact, DiagnosisTerminologyDim,
# DurationDim, EncounterFact. Not needed: ProblemListFact (dropped), EdVisitFact and
# HospitalAdmissionFact (EncounterFact's IsEdVisit / IsHospitalAdmission flags cover it).
#
# Open items before pulling:
# dt.Type = 'ICD-10-CM' is the spelling Cosmos uses (profile query 6, 2026-10-01).
# ICD-9 is left out: the window starts after the 2015 switch to ICD-10.
# Open: check project_db is the one to use.

cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 19900101   # all history: finds each patient's true first D89.44; Python applies the 3-year lookback (D23)
  max_date_key: 20260601   # the latest Cosmos has; move it when Cosmos does
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: HaT PheWAS
vars: {}
upload_cohorts: []
multipliers: []
batching:
  - chunk: 2000
cohorts:
  - name: hat_Patients
    dest_table: hat_Patients
    type: pk
    pull_this_cycle: true
    description: >
      Every patient with at least one D89.44 (hereditary alpha tryptasemia), at their
      first D89.44: index date, age, and demographics.
    granularity: One row per patient, at the earliest D89.44 diagnosis event.
    dedup_keys:
      - [PatientDurableKey]
    dedup_order_by:
      - IndexDate
      - IndexDiagnosisEventKey
    columns:
      - source: def.PatientDurableKey
        name: PatientDurableKey
        nullable: false
      - source: def.StartDateKey
        name: IndexDate
        nullable: true
        description: DateKey (YYYYMMDD) of the first D89.44.
      - source: def.DiagnosisEventKey
        name: IndexDiagnosisEventKey
        nullable: false
      - source: def.EncounterKey
        name: IndexEncounterKey
        nullable: true
      - source: dt.Value
        name: IndexICDCode
        nullable: true
      - source: dur.Years
        name: AgeAtIndex
        nullable: true
        description: Age in years at the first D89.44 (AgeKey through DurationDim).
      - source: p.Sex
        name: Sex
        nullable: true
      - source: p.ReliableSex
        name: ReliableSex
        nullable: true
      - source: p.FirstRace
        name: FirstRace
        nullable: true
      - source: p.MultiRacial
        name: MultiRacial
        nullable: true
      - source: p.Ethnicity
        name: Ethnicity
        nullable: true
      - source: p.BirthDate
        name: BirthDate
        nullable: true
      - source: p.DeathDate
        name: DeathDate
        nullable: true
        description: Ends observation early for patients who died.
    filter:
      from:
        - DiagnosisEventFact as def
      join:
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
        - "INNER JOIN PatientDim AS p ON p.DurableKey = def.PatientDurableKey"
        - "LEFT JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
      where:
        - "def._IsDeleted = 0"
        - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dt._IsDeleted = 0"
        - "dt.Type = 'ICD-10-CM'"
        - "dt.Value = 'D89.44'"
        - "p._IsDeleted = 0"
        - "p.IsCurrent = 1"
        - "p.IsValid = 1"
        - "p.UseInCosmosAnalytics_X = 1"

  - name: hat_Encounters
    dest_table: hat_Encounters
    type: fact
    pull_this_cycle: true
    description: >
      Every encounter for hat_Patients in the window. Python derives first/last
      encounter (observation start/end) and clinic-visit counts from it. A clinic
      visit is a distinct DateKey with IsOutpatientFaceToFaceVisit = 1 and a
      completed DerivedEncounterStatus.
    granularity: One row per encounter.
    dedup_keys:
      - [EncounterKey]
    dedup_order_by:
      - EncounterKey
    columns:
      - source: ef.PatientDurableKey
        name: PatientDurableKey
        nullable: false
      - source: ef.EncounterKey
        name: EncounterKey
        nullable: false
      - source: ef.DateKey
        name: DateKey
        nullable: false
      - source: ef.DerivedEncounterStatus
        name: DerivedEncounterStatus
        nullable: true
      - source: ef.DerivedEncounterType_X
        name: DerivedEncounterType_X
        nullable: true
      - source: ef.Type
        name: EncounterType
        nullable: true
      - source: ef.IsOutpatientFaceToFaceVisit
        name: IsOutpatientFaceToFaceVisit
        nullable: true
      - source: ef.IsEdVisit
        name: IsEdVisit
        nullable: true
      - source: ef.IsHospitalAdmission
        name: IsHospitalAdmission
        nullable: true
    filter:
      from:
        - EncounterFact as ef
      join:
        - "INNER JOIN {{prefix}}_hat_Patients AS pk ON pk.PatientDurableKey = ef.PatientDurableKey"
      where:
        - "ef._IsDeleted = 0"
        - "ef.DateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"

  - name: hat_Diagnoses
    dest_table: hat_Diagnoses
    type: fact
    pull_this_cycle: true
    description: >
      Every ICD-10-CM diagnosis event for hat_Patients in the window, with its type
      and status, so Python can filter (e.g. ruled-out) before collapsing to one row
      per patient, code and date. The PheWAS event table. D89.44 is kept here so
      Python can count its dates for the case rule, then drop it before the PheWAS.
    granularity: One row per diagnosis event and ICD-10-CM code.
    dedup_keys:
      - [DiagnosisEventKey, DiagnosisCode]
    dedup_order_by:
      - DiagnosisEventKey
    columns:
      - source: def.PatientDurableKey
        name: PatientDurableKey
        nullable: false
      - source: def.StartDateKey
        name: DiagnosisDate
        nullable: true
      - source: dt.Value
        name: DiagnosisCode
        nullable: true
      - source: dt.Type
        name: Vocabulary
        nullable: true
      - source: def.DiagnosisEventKey
        name: DiagnosisEventKey
        nullable: false
      - source: def.EncounterKey
        name: EncounterKey
        nullable: true
      - source: def.Type
        name: DiagnosisType
        nullable: true
      - source: def.Status
        name: DiagnosisStatus
        nullable: true
    filter:
      from:
        - DiagnosisEventFact as def
      join:
        - "INNER JOIN {{prefix}}_hat_Patients AS pk ON pk.PatientDurableKey = def.PatientDurableKey"
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
      where:
        - "def._IsDeleted = 0"
        - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dt._IsDeleted = 0"
        - "dt.Type = 'ICD-10-CM'"
