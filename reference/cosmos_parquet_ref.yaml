#Tables
table_reference: 
  - name: p
    dictionary_name: PatientWithDx #from recipes. I will get this first, then merge with other tables as below to find 
  - name: dur
    dictionary_name: DurationDim #the AgeKey isn't reliable, it's a key not an actual value. So we use it combined with DurationDim to get how long since an event. 
  - name: pd
    dictionary_name: PatientDim
  - name: def
    dictionary_name: DiagnosisEventFact
  - name: pw
    dictionary_name: phewasInfo #New parquet to mb made mixing PatientWIthDx with other table info, done by R/Python
  - name: ef
    dictionary_name: EncounterFact #Need to get this from data dictionary
  - name: Pro

required_columns:
  patient_id: PatientWithDx.PatientDurableKey
  exposure_flag: p.ICDCode # IF D89.44, is true. If not, then false. Alternatively, We'll designate the patient as having it by nature of being in the HatPt file
  no_known_exposure_flag: p.ICDCode # same as above
  sex: p.Sex
  race: p.FirstRace # An unknown amount are blank and other. Probably under 1000, if not under 500. We may have to exclude them. 
  ethnicity: pd.Ethnicity #Probably won't need it, likely just use race
  index_date: def.StartDateKey #The key is botht he month date and year (20260129), so we 
  index_year: def.StartDateKey # To make -> we have to use logic to make this colum. 
  index_quarter: def.StartDateKey #Maybe we just make it the start day +/- 45 days in the code instead? There doesn't seem to be a traditional quarte system
  age_at_index: p.AgeAtIndexDiagnosis 
  observation_start_date: pw.ObservationStartDate # Will need all EncounterKeys for patientCan I count just 'first encounter' and see if it's >2years before?  Will need R for this and 
  observation_end_date: pw.ObservationEndDate # Can I count just 'last encounter' and see if it's >2years after? 
  years_before_index: pw.YearsBeforeIndex #same as observation
  years_after_index: pw.YearsAfterIndex # Same as observation
  # DECIDED: a clinic visit = a distinct DateKey with an EncounterFact row where
  # IsOutpatientFaceToFaceVisit = 1 (and DerivedEncounterStatus = completed; value TBD
  # from profile_queries.sql #5). ED (IsEdVisit) and admissions (IsHospitalAdmission)
  # are counted separately if wanted, not lumped in. No HospitalAdmissionFact needed.
  # Pre = the 365 days before index (this is the matching variable; eligibility is >= 2).
  clinic_visits_pre_index: pw.ClinicVisitCountPreIndex
  clinic_visits_post_index: pw.ClinicVisitCountPostIndex
  # DECIDED: dropped. diagnosis_events_pre_index and problem_list_count are not
  # collected; in a pre-index PheWAS those diagnoses are the outcomes, so matching
  # on them removes part of the HaT signal. Clinic visits are the utilization measure.

# DECIDED: every diagnosis event, for matched cases and controls only (pulled after
# MatchIt). DiagnosisEventFact joined to DiagnosisTerminologyDim on DiagnosisKey,
# dt.Type limited to the ICD-10-CM / ICD-9-CM values (exact spellings: profile_queries.sql #6).
# Keep every event; do not deduplicate to one row per patient per code, or no one
# reaches the 2-distinct-dates phecode rule.
diagnosis_columns:
  patient_id: def.PatientDurableKey
  diagnosis_date: def.StartDateKey   # DateKey, converted in Python
  diagnosis_code: dt.Value
  vocabulary: dt.Type                # pheauxWAS normalizes e.g. 'ICD-10-CM' to ICD10CM
